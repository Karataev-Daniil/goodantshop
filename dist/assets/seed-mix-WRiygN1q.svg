<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Контейнер с зерновой смесью для муравьёв-жнецов">
  <!-- Временная иллюстрация вместо фото товара: контейнер (баночка) с зерновой
       смесью. Когда появится реальный снимок, положите рядом seed-mix.webp и
       поменяйте импорт в accessoriesData.js. -->
  <rect width="800" height="800" fill="#f4f0e8"/>

  <!-- мягкая тень под баночкой -->
  <ellipse cx="400" cy="706" rx="180" ry="26" fill="#e0d6c4"/>

  <!-- крышка -->
  <rect x="250" y="150" width="300" height="70" rx="20" fill="#c9553f"/>
  <rect x="250" y="150" width="300" height="30" rx="15" fill="#d76a54"/>
  <rect x="270" y="214" width="260" height="26" rx="10" fill="#bd8b6a"/>

  <!-- корпус банки -->
  <path d="M262 240h276v368a44 44 0 0 1-44 44H306a44 44 0 0 1-44-44z" fill="#ffffff"/>
  <path d="M262 240h276v368a44 44 0 0 1-44 44H306a44 44 0 0 1-44-44z" fill="none" stroke="#e0d6c4" stroke-width="8"/>

  <!-- зерно внутри -->
  <clipPath id="jar">
    <path d="M266 244h268v364a40 40 0 0 1-40 40H306a40 40 0 0 1-40-40z"/>
  </clipPath>
  <g clip-path="url(#jar)">
    <!-- уровень зерна -->
    <rect x="266" y="330" width="268" height="320" fill="#e6cf9f"/>
    <path d="M266 330q67 -26 134 0t134 0v40h-268z" fill="#e6cf9f"/>
    <g fill="#cba75c">
      <ellipse cx="318" cy="372" rx="18" ry="11" transform="rotate(-18 318 372)"/>
      <ellipse cx="386" cy="360" rx="17" ry="10" transform="rotate(14 386 360)"/>
      <ellipse cx="452" cy="376" rx="18" ry="11" transform="rotate(-6 452 376)"/>
      <ellipse cx="500" cy="360" rx="16" ry="10" transform="rotate(20 500 360)"/>
      <ellipse cx="312" cy="430" rx="17" ry="10" transform="rotate(26 312 430)"/>
      <ellipse cx="386" cy="420" rx="19" ry="11" transform="rotate(-12 386 420)"/>
      <ellipse cx="458" cy="434" rx="17" ry="10" transform="rotate(8 458 434)"/>
      <ellipse cx="512" cy="424" rx="16" ry="10" transform="rotate(-16 512 424)"/>
      <ellipse cx="308" cy="488" rx="18" ry="11" transform="rotate(16 308 488)"/>
      <ellipse cx="384" cy="478" rx="16" ry="10" transform="rotate(-24 384 478)"/>
      <ellipse cx="456" cy="492" rx="18" ry="11" transform="rotate(10 456 492)"/>
      <ellipse cx="506" cy="484" rx="16" ry="10" transform="rotate(22 506 484)"/>
      <ellipse cx="312" cy="546" rx="17" ry="10" transform="rotate(-14 312 546)"/>
      <ellipse cx="386" cy="536" rx="18" ry="11" transform="rotate(20 386 536)"/>
      <ellipse cx="458" cy="550" rx="17" ry="10" transform="rotate(-8 458 550)"/>
      <ellipse cx="508" cy="540" rx="16" ry="10" transform="rotate(12 508 540)"/>
      <ellipse cx="316" cy="602" rx="18" ry="11" transform="rotate(8 316 602)"/>
      <ellipse cx="388" cy="592" rx="16" ry="10" transform="rotate(-22 388 592)"/>
      <ellipse cx="458" cy="606" rx="18" ry="11" transform="rotate(14 458 606)"/>
      <ellipse cx="506" cy="596" rx="16" ry="10" transform="rotate(-10 506 596)"/>
    </g>
    <g fill="#b98f45">
      <ellipse cx="352" cy="398" rx="11" ry="6.5" transform="rotate(24 352 398)"/>
      <ellipse cx="430" cy="456" rx="11" ry="6.5" transform="rotate(-16 430 456)"/>
      <ellipse cx="352" cy="512" rx="11" ry="6.5" transform="rotate(30 352 512)"/>
      <ellipse cx="430" cy="566" rx="11" ry="6.5" transform="rotate(-12 430 566)"/>
      <ellipse cx="356" cy="612" rx="11" ry="6.5" transform="rotate(18 356 612)"/>
      <ellipse cx="470" cy="516" rx="11" ry="6.5" transform="rotate(-20 470 516)"/>
    </g>
    <!-- блик на стекле -->
    <rect x="286" y="260" width="30" height="380" rx="15" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- бумажная этикетка -->
  <rect x="300" y="470" width="200" height="96" rx="10" fill="#fbf7ef"/>
  <rect x="300" y="470" width="200" height="96" rx="10" fill="none" stroke="#e0d6c4" stroke-width="4"/>
  <rect x="330" y="536" width="140" height="8" rx="4" fill="#d8cdb8"/>
  <rect x="348" y="552" width="104" height="7" rx="3.5" fill="#e2d8c6"/>

  <!-- пара зёрен рядом -->
  <g fill="#cba75c">
    <ellipse cx="600" cy="672" rx="17" ry="10" transform="rotate(18 600 672)"/>
    <ellipse cx="638" cy="686" rx="13" ry="8" transform="rotate(-12 638 686)"/>
    <ellipse cx="196" cy="676" rx="16" ry="9" transform="rotate(-20 196 676)"/>
  </g>
</svg>
